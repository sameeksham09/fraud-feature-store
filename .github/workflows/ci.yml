name: CI

# ============================================================
# WHAT THIS DOES:
# - Runs automatically on every push to main and every PR
# - Checks code syntax (lint), runs tests, scans for security
# ============================================================

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write  # for Trivy SARIF upload

# ============================================================
# JOB 1: LINT - Check code syntax without running it
# ============================================================
jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Check Python syntax
        run: |
          echo "=== Checking Producer ==="
          python -m py_compile producer/transaction_generator.py
          python -m py_compile producer/produce_transactions.py

          echo "=== Checking Spark ==="
          python -m py_compile spark/feature_engineering.py
          python -m py_compile spark/redis_writer.py
          python -m py_compile spark/validation.py
          python -m py_compile spark/quarantine.py

          echo "=== Checking API ==="
          python -m py_compile api/main.py
          python -m py_compile api/auth.py
          python -m py_compile api/rate_limit.py
          python -m py_compile api/metrics.py
          python -m py_compile api/explain.py

          echo "=== Checking Models ==="
          python -m py_compile models/train.py

          echo "=== Checking Shared Modules ==="
          python -m py_compile features/__init__.py

          echo "=== Checking Load harness ==="
          python -m py_compile load/locustfile.py

          echo "✅ All syntax checks passed!"

      - name: Artifact leak guard (git ls-files must not contain mlruns/dump.rdb/venv)
        run: |
          echo "=== Checking for leaked artifacts in git index ==="
          if git ls-files | grep -Eq '(^|/)(mlruns/|dump\.rdb|venv/|\.venv/|\.env$|__pycache__/)'; then
            echo "❌ Leaked artifacts found in git index:"
            git ls-files | grep -E '(mlruns/|dump\.rdb|venv/|\.venv/|\.env$|__pycache__/)' || true
            exit 1
          fi
          echo "✅ No leaked artifacts"

# ============================================================
# JOB 2: TEST - Run all unit tests
# ============================================================
  test:
    runs-on: ubuntu-latest
    name: Test
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx pyyaml redis
          pip install -r producer/requirements.txt
          pip install -r spark/requirements.txt
          pip install fastapi uvicorn mlflow xgboost scikit-learn pandas numpy matplotlib pydantic prometheus-client python-dotenv

      - name: Set environment variables
        run: |
          echo "API_KEYS=test-key-for-ci" >> $GITHUB_ENV

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: .pytest_cache

# ============================================================
# JOB 3: SECURITY - Trivy, Bandit, pip-audit (non-blocking on first pass)
# ============================================================
  security:
    runs-on: ubuntu-latest
    name: Security
    needs: lint
    # Don't block the pipeline on first pass — surface findings without failing PRs
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install audit tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Bandit (Python SAST)
        continue-on-error: true
        run: |
          echo "=== Bandit ==="
          bandit -r api spark features -x tests --severity-level low || true

      - name: pip-audit (known CVEs in deps)
        continue-on-error: true
        run: |
          echo "=== pip-audit ==="
          pip-audit --desc || true

      - name: Trivy filesystem scan (CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        continue-on-error: true
        with:
          scan-type: 'fs'
          scan-ref: '.'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'
