# Prometheus configuration for fraud detection API
# Tells Prometheus where to find metrics to scrape

global:
  scrape_interval: 15s  # How often to scrape
  evaluation_interval: 15s  # How often to evaluate rules

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Fraud Detection API - scrape metrics from FastAPI /metrics
  # host.docker.internal: for local `make api` (uvicorn on host)
  # api:8000: for dockerized api service inside compose network
  - job_name: 'fraud-api'
    static_configs:
      - targets: ['host.docker.internal:8000', 'api:8000']
    scrape_interval: 30s
    metrics_path: '/metrics'